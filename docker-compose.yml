version: '3.8'

services:

  db:
    image: postgres:15
    container_name: db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5432:5432"

    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/procedures.sql

  backend:
    build: ./backend

    container_name: backend

    depends_on:
      - db

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend

    container_name: frontend

    depends_on:
      - backend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules