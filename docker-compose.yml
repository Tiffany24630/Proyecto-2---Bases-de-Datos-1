version: "3.9"

services:

  db:
    image: postgres:15
    container_name: db
    restart: always

    environment:
      POSTGRES_USER: proy3
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tienda

    ports:
      - "5433:5432"

    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./db/procedures.sql:/docker-entrypoint-initdb.d/procedures.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  backend:
    build: ./backend
    container_name: backend

    ports:
      - "3000:3000"

    depends_on:
      - db

    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend